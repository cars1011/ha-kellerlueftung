blueprint:
  name: "Kellerlüftung nach absoluter Feuchte / Cellar ventilation by absolute humidity"
  author: Karsten Hollop
  source_url: https://github.com/DEIN-GITHUB-NAME/ha-kellerlueftung/blob/main/blueprints/automation/kellerlueftung.yaml
  homeassistant:
    min_version: "2024.10.0"
  description: >
    ## 🇩🇪 Deutsch

    Öffnet Fenster (Stellmotoren als `switch` oder `cover`), wenn die Außenluft
    **absolut trockener** ist als die Kellerluft, und schließt sie wieder, sobald
    sich das Lüften nicht mehr lohnt, es zu kalt ist oder regnet.


    - Zustandsbasiert, ohne Wartezeiten: Jede Prüfung entscheidet neu. Neustarts
      oder Reloads lassen die Fenster nicht offen hängen.

    - Hysterese zwischen Öffnen und Schließen verhindert ständiges Auf und Zu.

    - Frostschutz für Außen- und Kellertemperatur.

    - Fällt ein Sensor aus, werden die Fenster geschlossen.

    - Optionaler Regensensor.


    **Voraussetzung:** Sensoren für absolute Feuchte (g/m³) innen und außen,
    z. B. aus der Integration
    [Thermal Comfort](https://github.com/dolezsa/thermal_comfort).


    ---


    ## 🇬🇧 English

    Opens windows (actuators as `switch` or `cover`) when the outdoor air is
    **drier in absolute terms** than the cellar air, and closes them again as
    soon as ventilating no longer helps, it gets too cold, or it rains.


    - State-based, no delays: every check decides anew. Restarts or reloads
      never leave the windows stuck open.

    - Hysteresis between opening and closing prevents constant flapping.

    - Frost protection for outdoor and cellar temperature.

    - If a sensor becomes unavailable, the windows are closed.

    - Optional rain sensor.


    **Requirement:** Absolute humidity sensors (g/m³) indoors and outdoors,
    e.g. from the
    [Thermal Comfort](https://github.com/dolezsa/thermal_comfort) integration.
  domain: automation
  input:
    cellar_ah:
      name: "Keller – absolute Feuchte / Cellar – absolute humidity"
      description: "Sensor in g/m³. / Sensor in g/m³."
      selector:
        entity:
          domain: sensor
    outdoor_ah:
      name: "Außen – absolute Feuchte / Outdoor – absolute humidity"
      description: "Sensor in g/m³. / Sensor in g/m³."
      selector:
        entity:
          domain: sensor
    cellar_temp:
      name: "Keller – Temperatur / Cellar – temperature"
      selector:
        entity:
          domain: sensor
          device_class: temperature
    outdoor_temp:
      name: "Außen – Temperatur / Outdoor – temperature"
      selector:
        entity:
          domain: sensor
          device_class: temperature
    windows:
      name: "Fenster-Stellmotoren / Window actuators"
      description: >
        Ein oder mehrere Antriebe (switch oder cover). /
        One or more actuators (switch or cover).
      selector:
        entity:
          domain:
            - switch
            - cover
          multiple: true
    open_diff:
      name: "Öffnen ab Differenz / Open at difference"
      description: >
        Der Keller muss mindestens um diesen Wert feuchter sein als außen. /
        The cellar must be at least this much more humid than outdoors.
      default: 1.0
      selector:
        number:
          min: 0.3
          max: 5
          step: 0.1
          unit_of_measurement: "g/m³"
    close_diff:
      name: "Schließen unter Differenz / Close below difference"
      description: >
        Muss kleiner sein als der Öffnen-Wert (Hysterese). /
        Must be lower than the open value (hysteresis).
      default: 0.3
      selector:
        number:
          min: 0
          max: 3
          step: 0.1
          unit_of_measurement: "g/m³"
    min_outdoor_temp:
      name: "Mindest-Außentemperatur / Minimum outdoor temperature"
      description: >
        Darunter bleiben die Fenster zu (Frostschutz). /
        Below this the windows stay closed (frost protection).
      default: 3
      selector:
        number:
          min: -10
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
    min_cellar_temp:
      name: "Mindest-Kellertemperatur / Minimum cellar temperature"
      description: >
        Darunter wird nicht weiter gelüftet, damit der Keller nicht auskühlt. /
        Below this ventilation stops so the cellar does not cool down too much.
      default: 10
      selector:
        number:
          min: 0
          max: 20
          step: 0.5
          unit_of_measurement: "°C"
    rain_sensor:
      name: "Regensensor (optional) / Rain sensor (optional)"
      description: >
        binary_sensor, der bei Regen 'on' ist. /
        binary_sensor that is 'on' while it rains.
      default: []
      selector:
        entity:
          domain: binary_sensor

mode: single
max_exceeded: silent

triggers:
  # Regelmäßige Prüfung / Periodic check
  - trigger: time_pattern
    minutes: "/5"
  # Nach dem Start von Home Assistant / After Home Assistant starts
  - trigger: homeassistant
    event: start
  # Bei Änderung der Feuchtewerte / When humidity values change
  - trigger: state
    entity_id: !input cellar_ah
  - trigger: state
    entity_id: !input outdoor_ah

variables:
  c_ah: !input cellar_ah
  o_ah: !input outdoor_ah
  c_t: !input cellar_temp
  o_t: !input outdoor_temp
  windows: !input windows
  rain: !input rain_sensor
  open_diff: !input open_diff
  close_diff: !input close_diff
  min_out: !input min_outdoor_temp
  min_cellar: !input min_cellar_temp

  # Alle Sensoren liefern gültige Werte / All sensors report valid values
  sensors_ok: >
    {{ has_value(c_ah) and has_value(o_ah) and has_value(c_t) and has_value(o_t) }}
  # Feuchte-Differenz Keller minus außen / Humidity difference cellar minus outdoor
  diff: >
    {{ states(c_ah)|float(0) - states(o_ah)|float(0) }}
  raining: >
    {{ rain not in [[], '', none] and is_state(rain, 'on') }}
  # Mindestens ein Fenster offen / At least one window open
  is_open: >
    {{ windows | select('is_state', ['on', 'open', 'opening']) | list | count > 0 }}
  should_open: >
    {{ sensors_ok and not raining
       and states(o_t)|float(-99) >= min_out
       and states(c_t)|float(-99) >= min_cellar
       and diff >= open_diff }}
  should_close: >
    {{ not sensors_ok or raining
       or states(o_t)|float(-99) < min_out
       or states(c_t)|float(-99) < min_cellar
       or diff <= close_diff }}

actions:
  - choose:
      # Schließen / Close
      - conditions: "{{ should_close and is_open }}"
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ windows }}"
      # Öffnen / Open
      - conditions: "{{ should_open and not is_open }}"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ windows }}"
